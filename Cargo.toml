[workspace]
resolver = "2"
members = ["crates/runadmingate-core", "crates/runadmingate-win", "crates/runadmingate", "crates/runadmingate-manager"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
